function rr(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.stroke()}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.random()*(b-a)+a}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

class VoidGame{
 constructor(){this.name='VOID//ASCENSION';this.desc='深空 Roguelite：清理敌群、强化 Build、击杀 Sector Boss。';this.best=+(localStorage.egcVoidBest||0);this.reset()}

 spawnWave(){this.wave++;let n=5+this.sector*2+this.wave;for(let i=0;i<n;i++)this.spawnEnemy();this.nextWave=gameT+15+this.wave}
 spawnEnemy(){let side=Math.floor(rnd(0,4)),x=side<2?rnd(20,GW-20):(side===2?-20:GW+20),y=side<2?(side===0?-20:GH+20):rnd(20,GH-20);let e={x,y,r:rnd(9,14),hp:35+this.sector*8,max:35+this.sector*8,spd:rnd(45,75)+this.sector*3,cd:rnd(.6,2),elite:Math.random()<.1};if(e.elite){e.r*=1.4;e.hp*=2;e.max=e.hp;e.spd*=1.15}this.es.push(e)}
spawnBoss(){let e={x:GW/2,y:90,r:45,hp:900+this.sector*420,max:900+this.sector*420,spd:45,cd:1.2,boss:true,phase:0};this.es.push(e);Sound.crash()}
 shoot(){if(this.p.cd>0)return;this.p.cd=this.p.rate;let a=Math.atan2(input.mouseY-this.p.y,input.mouseX-this.p.x);for(let i=0;i<this.p.shots;i++){let q=a+(i-(this.p.shots-1)/2)*.13;this.bs.push({x:this.p.x,y:this.p.y,vx:Math.cos(q)*680,vy:Math.sin(q)*680,r:4,dmg:this.p.dmg,life:1.1,crit:Math.random()<this.p.crit})}Sound.shot()}
 space(){if(this.p.dash>0)return;let dx=(input.keys.a||input.keys.arrowleft?-1:0)+(input.keys.d||input.keys.arrowright?1:0),dy=(input.keys.w||input.keys.arrowup?-1:0)+(input.keys.s||input.keys.arrowdown?1:0);if(!dx&&!dy){let a=Math.atan2(input.mouseY-this.p.y,input.mouseX-this.p.x);dx=Math.cos(a);dy=Math.sin(a)}let l=Math.hypot(dx,dy)||1;this.p.x=clamp(this.p.x+dx/l*150,20,GW-20);this.p.y=clamp(this.p.y+dy/l*150,20,GH-20);this.p.inv=.45;this.p.dash=2;Sound.dash()}
 hurt(d){if(this.p.inv>0)return;this.p.hp-=d;this.p.inv=.55;Sound.hit();for(let i=0;i<10;i++)this.fx.push({x:this.p.x,y:this.p.y,vx:rnd(-160,160),vy:rnd(-160,160),life:.5,c:'#ff4d79'});if(this.p.hp<=0)this.end()}
 kill(e){this.kills++;this.score+=e.boss?3000:e.elite?80:15;if(e.boss){this.sector++;this.wave=0;this.nextWave=gameT+4;Sound.win();for(let i=0;i<55;i++)this.fx.push({x:e.x,y:e.y,vx:rnd(-320,320),vy:rnd(-320,320),life:1,c:'#bd78ff'})}else this.orbs.push({x:e.x,y:e.y,xp:e.elite?15:5});}
 level(){this.p.lv++;this.p.xp-=this.p.next;this.p.next=Math.floor(this.p.next*1.35);let opts=[['RAIL CORE','伤害 +35%',()=>this.p.dmg*=1.35],['OVERCLOCK','射速 +25%',()=>this.p.rate/=1.25],['VOID PLATING','最大生命 +30',()=>{this.p.max+=30;this.p.hp+=30}],['SWARM LOGIC','弹丸 +1',().x=>this.p.shots++],['CRITICAL MATRI,X','暴击 +8%',()15=>this.p.crit,+=.08],['PHASE AMPLIFIER','闪避冷却 -30%',()=>this.p.dash=0]];let o=opts.sort(()=>Math.random()-.5).slice(0,3);gamePaused=true;showUpgrade(o)}
 update(dt){if(gamePaused)return;this.p.cd-=dt;this.p.dash-=dt;this.p.inv-=dt;let dx=(input.keys.a||input.keys.arrowleft?-1:0)+(input.keys.d||input.keys.arrowright?1:0),dy=(input.keys.w||input.keys.arrowup?-1:0)+(input.keys.s||input.keys.arrowdown?1:0);let l=Math.hypot(dx,dy)||1;if(dx||dy){this.p.x+=dx/l*this.p.spd*dt;this.p.y+=dy/l*this.p.spd*dt}this.p.x=clamp(this.pGW-15);this.p.y=clamp(this.p.y,15,GH-15);if(input.down)this.shoot();if(input.keys[' ']){input.keys[' ']=false;this.space()}if(gameT>this.nextWave&&!this.es.some(e=>e.boss))this.spawnWave();
  for(let i=this.es.length-1;i>=0;i--){let e=this.es[i],a=Math.atan2(this.p.y-e.y,this.p.x-e.x),d=distance(e,this.p);if(e.boss){e.x+=(GW/2-e.x)*dt*.3;e.y+=(GH*.22-e.y)*dt*.3}else if(d>e.r+this.p.r+16){e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt}else this.hurt(e.elite?14:7);e.cd-=dt;if(e.cd<=0){e.cd=e.boss?1.4:rnd(1.4,2.6);let n=e.boss?16:1;for(let k=0;k<n;k++){let q=e.boss?k*Math.PI*2/n+gameT*.3:a;this.eb.push({x:e.x,y:e.y,vx:Math.cos(q)*(e.boss?160:190),vy:Math.sin(q)*(e.boss?160:190),r:4,life:4,dmg:e.boss?10:7})}}}
  for(let i=this.bs.length-1;i>=0;i--){let b=this.bs[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=this.es.length-1;j>=0;j--){let e=this.es[j];if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.hp-=b.dmg*(b.crit?2.2:1);this.score+=Math.floor(b.dmg);hit=true;if(e.hp<=0){this.kill(e);this.es.splice(j,1)}break}}if(hit||b.life<=0||b.x<0||b.x>GW||b.y<0||b.y>GH)this.bs.splice(i,1)}
  for(let i=this.eb.length-1;i>=0;i--){let b=this.eb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(distance(b,this.p)<b.r+this.p.r){this.hurt(b.dmg);this.eb.splice(i,1)}else if(b.life<=0)this.eb.splice(i,1)}

class DriftGame{
 constructor(){this.name='NEON//DRIFT';this.desc='赛博无限竞速：左右漂移、穿越车流，速度会越来越离谱。';this.best=+(localStorage.egcDriftBest||0);this.reset()}

 update(dt){if(gamePaused||this.over)return;let left=input.keys.a||input.keys.arrowleft,right=input.keys.d||input.keys.arrowright;this.x+=(right?1:0-(left?1:0))*310*dt;this.x=clamp(this.x,GW/2-this.road*.38,GW/2+this.road*.38);this.speed=Math.min(720,this.speed+dt*6);this.score+=this.speed*dt*.12;this.spawn-=dt;if(this.spawn<=0){this.spawn=Math.max(.3,1.05-this.speed/1100);let lanes=[-.28,0,.28],lane=lanes[Math.floor(rnd(0,3))];this.cars.push({x:GW/2+lane*this.road,y:-50,w:34,h:65,v:rnd(.75,1.15),c:Math.random()>.5?'#ff4d91':'#61eaff'})}for(let i=this.cars.length-1;i>=0;i--){let c=this.cars[i];c.y+=this.speed*c.v*dt;if(Math.abs(c.x-this.x)<34&&c.y>GH*.67&&c.y<GH*.67+70){this.lives--;this.cars.splice(i,1);this.flash=.25;Sound.hit();if(this.lives<=0)this.end()}else if(c.y>GH+100){this.cars.splice(i,1);this.score+=25}}this.flash-=dt}
 draw(){g.fillStyle='#080615';g.fillRect(0,0,GW,GH);let horizon=GH*.38;g.fillStyle='#170b35';g.fillRect(0,horizon,GW,GH-horizon);g.fillStyle='#060510';g.beginPath();g.moveTo(GW*.32,horizon);g.lineTo(GW*.68,horizon);g.lineTo(GW*.94,GH);g.lineTo(GW*.06,GH);g.closePath();g.fill();for(let i=0;i<18;i++){let y=horizon+(i*i*2.5+gameT*160*(i/18))%(GH-horizon);let t=(y-horizon)/(GH-horizon),x1=GW/2-(.18+.7*t)*GW/2,x2=GW/2+(.18+.7*t)*GW/2;g.strokeStyle='#8c58ff55';g.beginPath();g.moveTo(x1,y);g.lineTo(x2,y);g.stroke()}g.strokeStyle='#ff55dc';g.lineWidth=2;g.beginPath();g.moveTo(GW*.32,horizon);g.lineTo(GW*.06,GH);g.moveTo(GW*.68,horizon);g.lineTo(GW*.94,GH);g.stroke();for(let i=0;i<3;i++){let x=GW/2+(i-1)*this.road*.28;g.strokeStyle='#fff3';g.setLineDash([25,30]);g.lineWidth=2;g.beginPath();g.moveTo(x,horizon);g.lineTo(x+(x-GW/2)*1.8,GH);g.stroke();g.setLineDash([])}
  for(const c of this.cars){g.save();g.translate(c.x,c.y);g.shadowBlur=20;g.shadowColor=c.c;g.fillStyle=c.c;g.fillRect(-c.w/2,-c.h/2,c.w,c.h);g.fillStyle='#0b0920';g.fillRect(-10,-18,20,25);g.fillStyle='#fff';g.fillRect(-15,25,8,4);g.fillRect(7,25,8,4);g.restore()}
  g.save();g.translate(this.x,GH*.72);g.shadowBlur=25;g.shadowColor='#ff4b98';g.fillStyle='#ff4b98';g.beginPath();g.roundRect(-19,-34,38,68,10);g.fill();g.fillStyle='#0a0920';g.fillRect(-12,-20,24,28);g.fillStyle='#61eaff';g.fillRect(-15,27,8,4);g.fillRect(7,27,8,4);g.restore();
  if(this.flash>0){g.fillStyle='#ff3e6a55';g.fillRect(0,0,GW,GH)}rr(15,86,190,62,14,'#080817c9','#ffffff15');text('NEON//DRIFT',28,107,12,'#fff');text(`SCORE ${Math.floor(this.score)}`,28,129,13,'#61eaff');text(`♥ ${this.lives}`,GW-20,100,14,'#ff5a96','right');text(`BEST ${Math.floor(this.best)}`,GW-20,122,10,'#9a93ac','right')}
 space(){this.x+=input.keys.a?-45:45}

class EmberGame{
 constructor(){this.name='EMBER//FALL';this.desc='奇幻竞技场：移动、斩击、连杀，敌人会成群逼近。';this.best=+(localStorage.egcEmberBest||0);this.reset()}

 update(dt){if(gamePaused||this.over)return;let dx=(input.keys.a||input.keys.arrowleft?-1:0)+(input.keys.d||input.keys.arrowright?1:0),dy=(input.keys.w||input.keys.arrowup?-1:0)+(input.keys.s||input.keys.arrowdown?1:0),l=Math.hypot(dx,dy)||1;if(dx||dy){this.p.x+=dx/l*this.p.spd*dt;this.p.y+=dy/l*this.p.spd*dt}this.p.x=clamp(this.p.x,30,GW-30);this.p.y=clamp(this.p.y,80,GH-30);this.p.atk-=dt;this.spawn-=dt;if(this.spawn<=0){this.spawn=Math.max(.3,.9-this.wave*.015);this.wave++;let a=rnd(0,Math.PI*2);this.es.push({x:this.p.x+Math.cos(a)*rnd(280,480),y:this.p.y+Math.sin(a)*rnd(280,480),r:rnd(12,19),hp:35+this.wave*2,spd:rnd(35,70)})}if(input.down&&this.p.atk<=0)this.attack();for(let i=this.es.length-1;i>=0;i--){let e=this.es[i],a=Math.atan2(this.p.y-e.y,this.p.x-e.x),d=distance(e,this.p);if(d>e.r+16){e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt}else{this.p.hp-=18*dt;this.p.combo=0}if(e.hp<=0){this.es.splice(i,1);this.score+=100+this.p.combo*12;this.p.combo++;for(let k=0;k<10;k++)this.fx.push({x:e.x,y:e.y,vx:rnd(-180,180),vy:rnd(-180,180),life:.5})}}for(let i=this.fx.length-1;i>=0;i--){let p=this.fx[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)this.fx.splice(i,1)}if(this.p.hp<=0)this.end()}
 attack(){this.p.atk=.34;let a=Math.atan2(input.mouseY-this.p.y,input.mouseX-this.p.x);for(let i=this.es.length-1;i>=0;i--){let e=this.es[i],d=distance(e,this.p),q=Math.atan2(e.y-this.p.y,e.x-this.p.x),diff=Math.atan2(Math.sin(q-a),Math.cos(q-a));if(d<115&&Math.abs(diff)<.95){e.hp-=55;Sound.hit();for(let k=0;k<8;k++)this.fx.push({x:e.x,y:e.y,vx:rnd(-120,120),vy:rnd(-120,120),life:.35})}}Sound.dash()}
 space(){this.attack()}
 draw(){g.fillStyle='#110906';g.fillRect(0,0,GW,GH);let rg=g.createRadialGradient(GW/2,GH/2,20,GW/2,GH/2,Math.max(GW,GH)*.7);rg.addColorStop(0,'#3b170f');rg.addColorStop(1,'#070407');g.fillStyle=rg;g.fillRect(0,0,GW,GH);g.strokeStyle='#ff9b4d16';for(let r=100;r<500;r+=75){g.beginPath();g.arc(GW/2,GH/2,r,0,Math.PI*2);g.stroke()}for(const p of this.fx){g.globalAlpha=clamp(p.life*2,0,1);g.fillStyle='#ffb34d';g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;for(const e of this.es){g.fillStyle='#24100c';g.strokeStyle='#ff6b3d';g.lineWidth=2;g.shadowBlur=15;g.shadowColor='#ff5a38';g.beginPath();g.arc(e.x,e.y,e.r,0,Math.PI*2);g.fill();g.stroke();g.shadowBlur=0}let a=Math.atan2(input.mouseY-this.p.y,input.mouseX-this.p.x);g.save();g.translate(this.p.x,this.p.y);g.rotate(a);g.fillStyle='#ffd36b';g.shadowBlur=22;g.shadowColor='#ff6b35';g.beginPath();g.arc(0,0,16,0,Math.PI*2);g.fill();g.strokeStyle='#fff4c0';g.lineWidth=7;g.beginPath();g.moveTo(4,-7);g.lineTo(92,0);g.stroke();g.restore();rr(15,86,210,62,14,'#120907c9','#ffffff15');text(`EMBER//FALL · WAVE ${this.wave}`,28,107,12,'#fff');text(`HP ${Math.max(0,Math.ceil(this.p.hp))} · COMBO ${this.p.combo}`,28,129,12,'#ffbd61');text(`${Math.floor(this.score)} SCORE`,GW-20,105,13,'#fff','right');text(`BEST ${Math.floor(this.best)}`,GW-20,125,10,'#9c8b82','right')}
 end(){this.over=true;this.best=Math.max(this.best,this.score);localStorage.egcEmberBest=this.best;Sound.crash();endGame('EMBER FALLEN',`Score ${Math.floor(this.score)} · Best ${Math.floor(this.best)}`)}
}

function showUpgrade(opts){document.getElementById('overlayTitle').textContent=T('game.choose');document.getElementById('overlayDesc').textContent=T('game.chooseDesc');let box=document.getElementById('gameControls');box.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='control';b.style.cursor='pointer';b.innerHTML=`<b style="color:#fff">${o[0]}</b><br>${o[1]}`;b.onclick=()=>{o[2]();gamePaused=false;document.getElementById('gameOverlay').classList.remove('show')};box.appendChild(b)});document.getElementById('gameOverlay').classList.add('show');document.getElementById('startGame').style.display='none';document.getElementById('quitGame').textContent=T('game.quit')}
function endGame(title,desc){gamePaused=true;document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayDesc').textContent=desc;document.getElementById('gameControls').innerHTML='';document.getElementById('gameOverlay').classList.add('show');document.getElementById('startGame').style.display='block';document.getElementById('startGame').textContent=T('game.reboot');document.getElementById('quitGame').textContent=T('game.backHome')}
function launch(type){currentType=type;gameT=0;if(type==='void')currentGame=new VoidGame();if(type==='drift')currentGame=new DriftGame();if(type==='ember')currentGame=new EmberGame();document.getElementById('homePage').style.display='none';document.getElementById('gameView').classList.add('active');document.getElementById('gameEyebrow').textContent='EGC GAME · '+type.toUpperCase();refreshGameLanguage();document.getElementById('startGame').style.display='block';document.getElementById('startGame').textContent=T('game.start');document.getElementById('gameOverlay').classList.add('show');gamePaused=true;gameRunning=true}

document.getElementById('backGame').onclick=()=>closeGame();
document.getElementById('quitGame').onclick=()=>closeGame();
document.getElementById('startGame').onclick=()=>{if(!currentGame)return;let title=document.getElementById('overlayTitle').textContent;if(title===T('game.pause')){gamePaused=false;document.getElementById('gameOverlay').classList.remove('show');Sound.ensure();return}if(title===T('game.choose'))return;currentGame.reset();gamePaused=false;document.getElementById('gameOverlay').classList.remove('show');Sound.ensure()};
document.getElementById('gamePause').onclick=()=>{if(!currentGame)return;gamePaused=!gamePaused;if(gamePaused){document.getElementById('overlayTitle').textContent=T('game.pause');document.getElementById('overlayDesc').textContent=T('game.paused');document.getElementById('gameControls').innerHTML='';document.getElementById('startGame').style.display='block';document.getElementById('startGame').textContent=T('game.resume');document.getElementById('gameOverlay').classList.add('show')}else document.getElementById('gameOverlay').classList.remove('show')};
document.getElementById('gameSound').onclick=()=>setSound(!soundOn);

function closeGame(){gameRunning=false;currentGame=null;document.getElementById('gameView').classList.remove('active');document.getElementById('homePage').style.display='block';document.getElementById('gameOverlay').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}

function bindJoy(el,propX,propY){
 let active=false;function set(e){let r=el.getBoundingClientRect(),t=e.touches?.[0]||e,cx=r.left+r.width/2,cy=r.top+r.height/2;window[propX]=clamp((t.clientX-cx)/45,-1,1);window[propY]=clamp((t.clientY-cy)/45,-1,1)}el.addEventListener('touchstart',e=>{active=true;set(e);e.preventDefault()},{passive:false});el.addEventListener('touchmove',e=>{if(active){set(e);e.preventDefault()}},{passive:false});el.addEventListener('touchend',()=>{active=false;window[propX]=window[propY]=0})
}
bindJoy(document.getElementById('joyMove'),'egcMX','egcMY');bindJoy(document.getElementById('joyAim'),'egcAX','egcAY');

let prev=performance.now();
function gameLoop(now){let dt=Math.min(.033,(now-prev)/1000);prev=now;if(gameRunning&&currentGame){gameT+=dt;if(currentGame instanceof VoidGame){input.keys.a=input.keys.a||window.egcMX<-.2;input.keys.d=input.keys.d||window.egcMX>.2;input.keys.w=input.keys.w||window.egcMY<-.2;input.keys.s=input.keys.s||window.egcMY>.2;currentGame.update(dt);input.keys.a=input.keys.d=input.keys.w=input.keys.s=false}else if(currentGame instanceof DriftGame){input.keys.a=input.keys.a||window.egcMX<-.2;input.keys.d=input.keys.d||window.egcMX>.2;currentGame.update(dt);input.keys.a=input.keys.d=false}else if(currentGame instanceof EmberGame){input.keys.a=input.keys.a||window.egcMX<-.2;input.keys.d=input.keys.d||window.egcMX>.2;input.keys.w=input.keys.w||window.egcMY<-.2;input.keys.s=input.keys.s||window.egcMY>.2;currentGame.update(dt);input.keys.a=input.keys.d=input.keys.w=input.keys.s=false}currentGame.draw()}requestAnimationFrame(gameLoop)}
requestAnimationFrame(gameLoop);
</script>
